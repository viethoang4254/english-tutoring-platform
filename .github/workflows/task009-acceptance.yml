      - name: Capture public-pages with synthetic fixtures
        id: capture_public_pages
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npx playwright test --config=playwright.task009.config.ts --grep @public-pages
        env:
          TASK009_EXPECTED_TESTS: '2'
          TASK009_UI_IMAGES: ${{ runner.temp }}/public-pages-review
      - name: Verify public-pages PNGs
        id: verify_public_pages
        if: ${{ !cancelled() && steps.capture_public_pages.outcome == 'success' }}
        shell: python
        run: |
          import os, pathlib, struct
