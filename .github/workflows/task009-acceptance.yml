      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && steps.verify_demo_courses.outcome == 'success' }}
        with:
          name: demo-courses-review-screenshots
          path: ${{ runner.temp }}/demo-courses-review/*.png
          retention-days: 7
          if-no-files-found: error

      - name: Capture Admin management with synthetic fixtures
        id: capture_admin_management
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npx playwright test --config=playwright.task009.config.ts --grep @admin-management
        env:
