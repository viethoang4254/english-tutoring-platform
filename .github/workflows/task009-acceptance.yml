                  assert data[:8] == b'\x89PNG\r\n\x1a\n'
                  w, h = struct.unpack('>II', data[16:24])
                  assert w == width and h > 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: meeting-review-screenshots
          path: ${{ runner.temp }}/meeting-review/*.png
          retention-days: 7
          if-no-files-found: error

      - name: Capture Admin course oversight
        id: capture_admin_courses
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npx playwright test --config=playwright.task009.config.ts --grep @admin-courses
        env:
          TASK009_EXPECTED_TESTS: '2'
          TASK009_UI_IMAGES: ${{ runner.temp }}/admin-course-review
      - name: Verify Admin course PNGs
        id: verify_admin_courses
        if: ${{ !cancelled() && steps.capture_admin_courses.outcome == 'success' }}
        shell: python
        run: |
          import os, pathlib, struct
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'admin-course-review'
          for page in ('admin-course-directory', 'admin-course-detail'):
              for viewport, width in (('desktop', 1440), ('mobile', 390)):
                  data = (root / f'{page}-{viewport}.png').read_bytes()
                  assert data[:8] == b'\x89PNG\r\n\x1a\n'
                  w, h = struct.unpack('>II', data[16:24])
                  assert w == width and h > 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && steps.verify_admin_courses.outcome == 'success' }}
        with:
          name: admin-course-review-screenshots
          path: ${{ runner.temp }}/admin-course-review/*.png
          retention-days: 7
          if-no-files-found: error

      - name: Capture Admin analytics
        id: capture_admin_analytics
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npx playwright test --config=playwright.task009.config.ts --grep @admin-analytics
        env:
