name: TASK-009 isolated acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smtp-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.11'
      - run: python ci/task009/run.py prepare
      - run: python ci/task009/run.py smtp
      - run: python ci/task009/run.py smtp-test
      - if: always()
        run: python ci/task009/run.py cleanup
  backend-feature-acceptance:
    needs: smtp-acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.11'
      - run: python ci/task009/run.py prepare
      - run: python -m unittest discover -s ci/task009 -p 'test_*.py'
      - run: python ci/task009/backend_tests.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: backend-feature-counts
          path: ${{ runner.temp }}/task009/reports/*.json
          retention-days: 7
          if-no-files-found: warn
      - if: always()
        run: python ci/task009/run.py cleanup
  profile-browser-acceptance:
    needs: backend-feature-acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=1536
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.11'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - run: python ci/task009/run.py prepare
      - run: npm install --global npm@11.19.0
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: node --test --test-concurrency=1 tests/api.spec.ts tests/browser-api.spec.ts tests/vi.spec.ts tests/session-input.spec.ts tests/receiving.spec.ts
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python ci/task009/run.py database
      - run: python ci/task009/run.py smtp
      - run: python ci/task009/run.py backend
      - run: python ci/task009/run.py resources
      - name: Mocked profile acceptance (24 cases)
        run: npx playwright test --config=playwright.task009.config.ts tests/e2e/student-profile.spec.ts
        working-directory: frontend
        env:
          TASK009_EXPECTED_TESTS: '24'
      - run: python ci/task009/run.py resources
      - name: Live profile acceptance (8 cases)
        run: npx playwright test --config=playwright.task009.config.ts tests/live/profile.spec.ts
        working-directory: frontend
        env:
          TASK009_EXPECTED_TESTS: '8'
      - run: python ci/task009/run.py resources
      - name: Mocked Dashboard and Calendar regressions (64 cases)
        run: npx playwright test --config=playwright.task009.config.ts tests/e2e/teacher-calendar.spec.ts tests/e2e/unified-dashboard.spec.ts tests/e2e/teacher-login.spec.ts tests/e2e/teacher-courses.spec.ts tests/e2e/teacher-sessions.spec.ts
        working-directory: frontend
        env:
          TASK009_EXPECTED_TESTS: '64'
      - run: python ci/task009/run.py resources
      - name: Additional feature browser acceptance (108 cases)
        run: npx playwright test --config=playwright.task009.config.ts tests/e2e/admin-categories.spec.ts tests/e2e/admin-dashboard.spec.ts tests/e2e/course-discovery.spec.ts tests/e2e/course-registration.spec.ts tests/e2e/student-dashboard.spec.ts tests/e2e/teacher-dashboard.spec.ts
        working-directory: frontend
        env:
          TASK009_EXPECTED_TESTS: '108'
      - run: python ci/task009/run.py resources
      - name: Receiving account submission and review (30 cases)
        run: npx playwright test --config=playwright.task009.config.ts tests/e2e/receiving-accounts.spec.ts
        working-directory: frontend
        env:
          TASK009_EXPECTED_TESTS: '30'
      - run: python ci/task009/run.py resources
      - name: Enrollment management browser acceptance (30 cases)
        run: npx playwright test --config=playwright.task009.config.ts tests/e2e/student-enrollments.spec.ts
        working-directory: frontend
        env:
          TASK009_EXPECTED_TESTS: '30'
      - run: python ci/task009/run.py resources
      - name: Checkout browser acceptance (26 cases)
        run: npx playwright test --config=playwright.task009.config.ts tests/e2e/course-checkout.spec.ts
        working-directory: frontend
        env:
          TASK009_EXPECTED_TESTS: '26'
      - run: python ci/task009/run.py resources
      - name: Live Calendar and course publication acceptance (4 cases)
        run: npx playwright test --config=playwright.task009.config.ts tests/live/calendar.spec.ts tests/live/course-publication.spec.ts
        working-directory: frontend
        env:
          TASK009_EXPECTED_TESTS: '4'
      - if: always()
        run: python ci/task009/run.py cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-acceptance-counts
          path: ${{ runner.temp }}/task009/reports/*.json
          retention-days: 7
          if-no-files-found: warn

  ui-review-screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_API_ORIGIN: http://127.0.0.1:8081
      NODE_OPTIONS: --max-old-space-size=1536
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - run: npm install --global npm@11.19.0
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Capture synthetic desktop and mobile review pages
        working-directory: frontend
        run: npx playwright test --config=playwright.task009.config.ts --grep @ui-review
        env:
          TASK009_EXPECTED_TESTS: '8'
          TASK009_UI_IMAGES: ${{ runner.temp }}/ui-review
      - name: Verify ten full-page screenshots
        run: |
          for page in teacher-dashboard landing student-dashboard admin-categories course-detail; do
            for viewport in desktop mobile; do
              test -s "$RUNNER_TEMP/ui-review/$page-$viewport.png"
            done
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: ui-review-screenshots
          path: ${{ runner.temp }}/ui-review/*.png
          retention-days: 7
          if-no-files-found: warn

      - name: Capture checkout states with synthetic fixtures
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npx playwright test --config=playwright.task009.config.ts --grep @checkout-review
        env:
          TASK009_EXPECTED_TESTS: '2'
          TASK009_UI_IMAGES: ${{ runner.temp }}/checkout-review
      - name: Verify six checkout PNGs
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import os, pathlib, struct
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'checkout-review'
          for page in ('enrollment-confirmation', 'vietqr-payment', 'payment-confirmed'):
              for viewport, width in (('desktop', 1440), ('mobile', 390)):
                  data = (root / f'{page}-{viewport}.png').read_bytes()
                  assert data[:8] == b'\x89PNG\r\n\x1a\n'
                  w, h = struct.unpack('>II', data[16:24])
                  assert w == width and h > 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: checkout-review-screenshots
          path: ${{ runner.temp }}/checkout-review/*.png
          retention-days: 7
          if-no-files-found: error
