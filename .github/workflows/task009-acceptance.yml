                  assert data[:8] == b'\x89PNG\r\n\x1a\n'
                  w, h = struct.unpack('>II', data[16:24])
                  assert w == width and h > 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: google-calendar-review-screenshots
