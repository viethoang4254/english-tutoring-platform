      - name: Capture Google synchronization states with synthetic fixtures
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npx playwright test --config=playwright.task009.config.ts --grep @calendar-sync-review
        env:
          TASK009_EXPECTED_TESTS: '6'
          TASK009_UI_IMAGES: ${{ runner.temp }}/calendar-sync-review
      - name: Verify six Teacher Calendar synchronization PNGs
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import os, pathlib, struct
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'calendar-sync-review'
          for page in ('teacher-sync-synced', 'teacher-sync-pending', 'teacher-sync-failed'):
              for viewport, width in (('desktop', 1440), ('mobile', 390)):
                  data = (root / f'{page}-{viewport}.png').read_bytes()
                  assert data[:8] == b'\x89PNG\r\n\x1a\n'
                  w, h = struct.unpack('>II', data[16:24])
                  assert w == width and h > 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: google-calendar-sync-review-screenshots
          path: ${{ runner.temp }}/calendar-sync-review/*.png
          retention-days: 7
          if-no-files-found: error

  windows-test-package:
    if: inputs.package_after_run != ''
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/google-test-package.yml
    with:
      acceptance_run_id: ${{ inputs.package_after_run }}
