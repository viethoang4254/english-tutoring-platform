          retention-days: 7
          if-no-files-found: error

      - name: Capture Teacher course management and roster with synthetic API fixtures
        id: capture_course_invitations
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npx playwright test --config=playwright.task009.config.ts --grep "@course-invitations|@course-roster"
        env:
          TASK009_EXPECTED_TESTS: '4'
          TASK009_UI_IMAGES: ${{ runner.temp }}/course-invitations-review
      - name: Verify six Teacher course management PNGs
        id: verify_course_invitations
